# Memoria aumentada para Gradle Daemon (2GB Heap Space)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Usar el Gradle JDK seleccionado en Android Studio (Java 17).
# No fijar el JBR del IDE: una actualización puede cambiar su versión de Java.

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true
