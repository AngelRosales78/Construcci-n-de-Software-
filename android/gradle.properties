# Memoria aumentada para Gradle Daemon (2GB Heap Space)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Apuntar directamente al JDK 17 (JBR) embebido en Android Studio
# Use JAVA_HOME or select a Java 17 Gradle JDK in Android Studio.

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true
